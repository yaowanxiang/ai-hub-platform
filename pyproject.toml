[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aihub-platform"
version = "0.1.0"
description = "让AI能力像水电一样触手可及 - 通用人工智能平台"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "yaowanxiang", email = "yaowanxiang@qut.edu.cn"}
]
keywords = [
    "ai", "agent", "llm", "gpt", "automation",
    "multimodal", "self-learning", "auto-evolution",
    "modular", "no-code", "low-code"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "anthropic>=0.18.0",
    "openai>=1.3.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "whisper>=20231117",
    "pydub>=0.25.1",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "soundfile>=0.12.1",
    "pyaudio>=0.2.13",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "pylint>=2.17.0",
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "mypy>=1.4.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
]
enterprise = [
    # 企业版依赖（可选）
    "web3>=6.0.0",
    "cryptography>=41.0.0",
    "aiohttp>=3.8.0",
]
multimodal = [
    # 多模态依赖（可选）
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "torchvision>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/yaowanxiang/ai-hub-platform"
Documentation = "https://github.com/yaowanxiang/ai-hub-platform/docs"
Repository = "https://github.com/yaowanxiang/ai-hub-platform"
"Bug Tracker" = "https://github.com/yaowanxiang/ai-hub-platform/issues"
Changelog = "https://github.com/yaowanxiang/ai-hub-platform/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-data]
core = ["*.json", "*.yaml"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=core --cov-report=term-missing"

[tool.coverage.run]
source = ["core"]
omit = ["tests/*", "*/tests/*"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"